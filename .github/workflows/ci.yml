name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Install dependencies
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('npm', ['ci'], { encoding: 'utf8' });
          process.stdout.write(result.stdout ?? '');
          process.stderr.write(result.stderr ?? '');
          if (result.status !== 0) {
            const detail = `${result.stdout ?? ''}\n${result.stderr ?? ''}\n${result.error ?? ''}`.trim().split('\n').slice(-35).join('\n');
            const escaped = detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.error(`::error title=Dependency installation failed::${escaped}`);
            process.exit(result.status ?? 1);
          }
          NODE
      - run: npm run test:coverage
      - run: npm run package
